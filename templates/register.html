<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Registration</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Create Account</h1>

        <p class="subtitle">
            SQL Injection Protected System
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="alert {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            {{ csrf_token() }}

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
                maxlength="30"
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 8 characters"
                required
                minlength="8"
            >


            <label>
                Phone Number
            </label>

            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
            >

            <button type="submit">
                Create Account
            </button>

        </form>


        <p class="bottom-text">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

</body>
</html>
